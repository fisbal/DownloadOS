name: Build DownloadOS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        run: base64 -d android/app/downloados.jks.b64 > android/app/downloados.jks

      - name: Build signed APK
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DownloadOS.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadOS-apk
          path: DownloadOS.apk

      - name: Publish a download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DownloadOS 1.0.${{ github.run_number }}
          make_latest: true
          files: DownloadOS.apk
          body: |
            **DownloadOS** — l'installateur d'APK de MartinB OS / the MartinB OS APK installer.

            **Installer / Install**
            1. Touche **DownloadOS.apk** ci-dessous / Tap **DownloadOS.apk** below.
            2. Ouvre le fichier ; si Android le demande, autorise ton navigateur à *installer des applis inconnues*.
            3. **Installer** → **Ouvrir**.

            Ensuite, toutes tes apps (MarbleOS, etc.) s'installent et se mettent à jour depuis DownloadOS — y compris DownloadOS lui-même.

      - name: Clear old failure report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete build-failed -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Errors"; echo '```'
            grep -n -E "error:|e: |FAILED|What went wrong|Exception" build.log | head -80 || true
            echo '```'; echo "## Tail"; echo '```'
            tail -c 30000 build.log || echo "no log"
            echo '```'
          } > report.md
          gh release delete build-failed -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create build-failed --prerelease --title "Build failed #${{ github.run_number }}" --notes-file report.md -R "$GITHUB_REPOSITORY"
